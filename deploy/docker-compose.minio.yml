# Preserve the original Compose project name and existing MinIO volume.
name: smart-picutre

services:
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: smart-image-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      # 允许前端（如图片裁剪 canvas）跨域读取图片
      MINIO_API_CORS_ALLOW_ORIGIN: "*"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  minio-data:
