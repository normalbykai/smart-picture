[project]
name = "smart-picture-ai-service"
version = "0.1.0"
description = "Internal AI service for smart-picture"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "pydantic-settings>=2.6,<3.0",
    "uvicorn>=0.30,<1.0",
]

[dependency-groups]
dev = ["httpx>=0.27,<1.0", "pytest>=8,<10", "ruff>=0.9,<1.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
